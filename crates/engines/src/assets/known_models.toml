# Which asset types a model makes, for the models whose provider's own list doesn't say.
#
# The live model lists tell the type for most models (fal `category`, Scenario `capabilities`).
# They do not for audio: fal's `text-to-audio` and Scenario's `txt2audio` mix speech, sound effects
# and music, and ElevenLabs lists speech models only. This table is the fallback for those, and
# for the models this app has always offered. `id` is the provider's own id for the model (fal and
# Scenario list models by it; ElevenLabs by its `model_id`), never a name of ours.
#
# `fixed = true` marks a model that is the provider's only endpoint for its type and is not in any
# live list (ElevenLabs sound effects and music): the picker offers it without asking the provider.
# `credits_per_second` is the credit rate this app keeps for such a fixed model, because
# ElevenLabs publishes no per-model rate in its API; it is the one price kept here, and is updated
# with releases. Prices of every other model come from the provider.
#
# The audio entries below were classified on 2026-11-03 from fal's `GET /v1/models` and
# Scenario's `GET /v1/models/public`. A model is listed only when its name and tags point to one
# asset type and to no other. Left out: models whose tags disagree (`fal-ai/lyria3`,
# `fal-ai/lyria3/pro`, `google/lyria-3.5`, `minimax/music-3`); models that say too little
# (`bytedance/seed-audio-1.0`, `mureka/v8/generate/soundtrack`, `fal-ai/mmaudio-v2/text-to-audio`,
# `fal-ai/stable-audio-25/text-to-audio`, `fal-ai/ltx-2.3-quality/text-to-audio`); and speech models
# that aren't plain text to speech (`fal-ai/elevenlabs/text-to-dialogue/eleven-v3`,
# `mureka/api/generate/podcast`, `fal-ai/zonos`). Models Scenario tags `deprecated` are left out too.

version = 1

# The models the previous fixed table offered (the old `assets.toml`, now removed), under the provider's own ids. Its
# Scenario 3D model, `model_meshy-img23d` (Meshy 6), is deprecated at Scenario, so the entry here is
# the model that replaces it, `model_meshy-7-1-img23d`.
