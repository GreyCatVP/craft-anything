provider = "elevenlabs"
id = "eleven_multilingual_v2"
name = "ElevenLabs Multilingual v2"
kinds = ["speech"]

# ElevenLabs' two fixed endpoints. Credit rates are the ones ElevenLabs states, converted to
# credits per second.
#
# Both ids are deprecated by ElevenLabs, which still serves them: `eleven_text_to_sound_v2` is
# removed on 2027-03-01 (replaced by `eleven_text_to_sound_v3`) and `music_v1` on 2027-01-31
# (replaced by `music_v2_5`; `music_v2` also exists). The replacements are not listed here because
# ElevenLabs documents no credit rate for them, and a guessed rate would mislimit spending. Read on
# 2026-11-03: https://elevenlabs.io/docs/overview/capabilities/sound-effects ("40 credits per
# second" with no model named, v2 "deprecated and will be removed on March 1, 2027"),
# https://elevenlabs.io/docs/overview/capabilities/music (no credit cost for any model, `music_v1`
# "will be removed on January 31, 2027"), https://elevenlabs.io/docs/overview/models, and
# https://elevenlabs.io/pricing/api (dollars, not credits). When ElevenLabs documents their rates,
# add them as `fixed` models and remove the old ones before the removal dates.
#
# Sound effects: "Cost: 40 credits per second when duration is specified" (the range is 0.1 to
# 30 seconds), https://elevenlabs.io/docs/overview/capabilities/sound-effects, read on 2026-11-03.
# The pricing page adds that a sound whose duration the AI picks costs 200 credits per generation
# (https://elevenlabs.io/pricing); this app always passes a duration, so the per-second rate applies.
# The same page states the 40 credits per second with a maximum duration of 22 seconds, while the API
# docs allow 0.1 to 30 seconds. The app keeps its own range of 0.5 to 30 seconds, so the estimate for a
# sound longer than 22 seconds is unverified.
[[model]]
provider = "elevenlabs"
id = "eleven_text_to_sound_v2"
name = "ElevenLabs Sound Effects v2"
kinds = ["sound_effect"]
credits_per_second = 40.0
fixed = true

# Music: "Eleven Music 900 credits per minute", listed among "Approximate credit costs" in the
# FAQ of https://elevenlabs.io/pricing, read on 2026-11-03; 900 credits a minute is 15 credits a
# second (converted here). The page gives an approximate rate for the product, not one for
# `music_v1`, and ElevenLabs' API pricing page (https://elevenlabs.io/pricing/api) quotes music in
# US dollars per generation instead.
[[model]]
provider = "elevenlabs"
id = "music_v1"
name = "ElevenLabs Music v1"
kinds = ["music"]
credits_per_second = 15.0
fixed = true

