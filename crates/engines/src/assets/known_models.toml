name = "Scenario Gemini 3.1"
kinds = ["image"]

[[model]]
provider = "fal"
id = "tripo3d/p1/image-to-3d"
name = "Tripo P1"
kinds = ["model_3d"]

[[model]]
provider = "scenario"
id = "model_meshy-7-1-img23d"
name = "Scenario Meshy 7.1"
